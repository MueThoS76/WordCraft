services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: presscraft
      POSTGRES_PASSWORD: presscraft
      POSTGRES_DB: presscraft
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presscraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-Hosting-Setup (ADR 0015, Schritt 10): apps/admin läuft als
  # statischer Build mit, kein eigener Container (siehe apps/server/src/main.ts).
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WEB_BASE_URL: ${WEB_PUBLIC_URL:-http://localhost:4321}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://presscraft:presscraft@postgres:5432/presscraft
      # Ohne ADMIN_PASSWORD gibt es bewusst keinen Standard-Admin: Beim ersten
      # Aufruf von /admin erscheint der Einrichtungsassistent.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Browser-Origin, von dem aus Cookie-Requests ankommen — im
      # Self-Hosting-Setup derselbe Origin wie der Server selbst, da
      # apps/admin unter /admin mitläuft (ADR 0012/0014).
      ADMIN_ORIGIN: ${SERVER_PUBLIC_URL:-http://localhost:3000}
      PORT: "3000"
      # Hochgeladene Medien — als Volume, damit sie Container-Updates überleben.
      MEDIA_DIR: /data/media
      PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - media-data:/data/media
    ports:
      - "3000:3000"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_BASE_URL: http://server:3000/api/v1
    ports:
      - "4321:4321"

volumes:
  postgres-data:
  media-data:
