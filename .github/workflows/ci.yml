name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm lint:boundaries

      - run: pnpm typecheck

      - run: pnpm build

  # Unit-, Integrations- und E2E-Tests gegen eine echte Postgres-Instanz.
  # Port 5433, weil .env.example, die Integrationstests und der E2E-Test
  # (der für den Einrichtungsassistenten eine eigene Datenbank anlegt) davon ausgehen.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: presscraft
          POSTGRES_PASSWORD: presscraft
          POSTGRES_DB: presscraft
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U presscraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://presscraft:presscraft@localhost:5433/presscraft
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm db:migrate

      - run: pnpm test
